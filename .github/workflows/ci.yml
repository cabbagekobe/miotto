# CI for this Go project.
# Tool/runtime versions are pinned in mise.toml; verification has the single entry point `make check`.
name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev  # needed to build transport (gousb/cgo)
      - uses: jdx/mise-action@v3   # reproduce all tools from mise.toml
      - run: make check

  audit:
    # govulncheck is advisory: a failure does not fail the CI as a whole
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev  # needed to analyze transport (gousb/cgo)
      - uses: jdx/mise-action@v3
      - run: make audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
